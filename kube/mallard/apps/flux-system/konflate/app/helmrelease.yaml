---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: konflate
spec:
  chartRef:
    kind: OCIRepository
    name: konflate
  interval: 1h
  values:
    config:
      repo: github://surskitt/paddlepond
      statusChecks: true
      prComments: true
      verifyImages: true
      # mcp: true
    secret:
      existingSecret: konflate
    httpRoute:
      enabled: true
      hostnames:
        - "konflate.${SECRET_DOMAIN}"
      parentRefs:
        - name: envoy-internal
          namespace: networking
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: 2000m
        memory: 512Mi
