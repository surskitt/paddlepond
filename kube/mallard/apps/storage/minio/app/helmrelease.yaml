---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minio
spec:
  chartRef:
    kind: OCIRepository
    name: minio
  interval: 1h
  values:
    controllers:
      minio:
        containers:
          app:
            image:
              repository: ghcr.io/coollabsio/minio
              tag: 2025-10-15T17-29-55Z 
            env:
              TZ: "Europe/London"
              MINIO_UPDATE: "off"
              MINIO_BROWSER_REDIRECT_URL: "https://minio.${SECRET_DOMAIN}"
              MINIO_SERVER_URL: "https://s3.${SECRET_DOMAIN}"
              MINIO_VOLUMES: /data
            envFrom:
              - secretRef:
                  name: minio
            args: ["server", "/data", "--console-address", ":9001"]
            # resources:
            #   requests:
            #     memory: 750Mi
            #     cpu: 100m
            #   limits:
            #     memory: 750Mi
        annotations:
          secret.reloader.stakater.com/reload: minio
    defaultPodOptions:
      securityContext:
        runAsUser: 1000
        runAsGroup: 100
        fsGroup: 100
        fsGroupChangePolicy: "OnRootMismatch"
        supplementalGroups: [100]
    service:
      app:
        ports:
          http:
            port: &port-console 9001
          api:
            enabled: true
            port: &port-api 9000
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |
            group: storage
        hostnames:
          - "minio.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: networking
        rules:
          - backendRefs:
              - identifier: app
                port: *port-console
      s3:
        annotations:
          gatus.home-operations.com/endpoint: |
            group: storage
        hostnames:
          - "s3.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: networking
        rules:
          - backendRefs:
              - identifier: app
                port: *port-api
    persistence:
      data:
        enabled: true
        type: hostPath
        hostPath: /var/mnt/ssd/k3s_storage/minio
        hostPathType: Directory
        advancedMounts:
          minio:
            app:
              - path: /data
                readOnly: false
