---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: backrest
spec:
  chartRef:
    kind: OCIRepository
    name: backrest
  interval: 1h
  values:
    controllers:
      backrest:
        annotations:
          reloader.stakater.com/auto: "true"
        # initContainers:
        #   init-config:
        #     image:
        #       repository: docker.io/mikefarah/yq
        #       tag: 4.53.6
        #     command: ["/bin/sh", "-c"]
        #     args:
        #       - yq -o json /config/config.yaml > /app/config/config.json
        #     securityContext:
        #       privileged: true
        #       runAsUser: 0
        containers:
          app:
            image: 
              repository: ghcr.io/garethgeorge/backrest
              tag: v1.14.1@sha256:b852979754281026230cc69fb11428e6d57c9a97784ab4a444ffc7934c53a215
            env:
              BACKREST_DATA: /app/data
              BACKREST_CONFIG: /app/config/config.json
              XDG_CACHE_HOME: /app/cache
            envFrom:
              - secretRef:
                  name: backrest
            securityContext:
              privileged: true
              runAsUser: 0
            resources:
              requests:
                cpu: 5m
              limits:
                memory: 512Mi
    service:
      app:
        controller: backrest
        ports:
          http:
            port: &port 9898
    route:
      app:
        hostnames:
          - "backrest.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: networking
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      app:
        enabled: true
        type: persistentVolumeClaim
        storageClass: local-hostpath
        accessMode: ReadWriteOnce
        size: 1Gi
        advancedMounts:
          backrest:
            app:
              - path: /app
        dataSourceRef:
          kind: ReplicationDestination
          apiGroup: volsync.backube
          name: backrest-restore
      cache:
        enabled: true
        type: emptyDir
        globalMounts:
          - path: /app/cache
      # config:
      #   type: emptyDir
      #   globalMounts:
      #     - path: /app/config
      processlogs:
        type: emptyDir
        advancedMounts:
          backrest:
            app:
              - path: /app/data/processlogs
      ssd:
        enabled: true
        type: hostPath
        hostPath: /var/mnt/ssd
        advancedMounts:
          backrest:
            app:
              - path: /var/mnt/ssd
