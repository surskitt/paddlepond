# ---
# apiVersion: kopiur.home-operations.com/v1alpha1
# kind: SnapshotPolicy
# metadata:
#   name: backrest
# spec:
#   compression:
#     compressor: zstd
#   mover:
#     cache:
#       capacity: 5Gi
#       mode: Persistent
#       storageClassName: local-hostpath
#     securityContext:
#       runAsUser: 0
#       runAsGroup: 0
#       runAsNonRoot: false
#     privilegedMode: true
#   repository:
#     kind: ClusterRepository
#     name: kopiur-local
#   retention:
#     keepLatest: 3
#     keepHourly: 24
#     keepDaily: 7
#     keepWeekly: 2
#   sources:
#     - pvc:
#         name: backrest
#   volumeSnapshotClassName: local-hostpath
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: backrest-r2
spec:
  compression:
    compressor: zstd
  mover:
    cache:
      capacity: 5Gi
      mode: Persistent
      storageClassName: local-hostpath
    securityContext:
      runAsUser: 0
      runAsGroup: 0
      runAsNonRoot: false
    privilegedMode: true
  repository:
    kind: ClusterRepository
    name: kopiur-r2
  retention:
    keepLatest: 3
    keepHourly: 24
    keepDaily: 7
    keepWeekly: 2
  sources:
    - pvc:
        name: backrest
  volumeSnapshotClassName: local-hostpath
# ---
# apiVersion: kopiur.home-operations.com/v1alpha1
# kind: SnapshotSchedule
# metadata:
#   name: backrest
# spec:
#   policyRef:
#     name: backrest
#   schedule:
#     cron: 0 5 * * *
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: backrest-r2
spec:
  policyRef:
    name: backrest-r2
  schedule:
    cron: 30 5 * * *
