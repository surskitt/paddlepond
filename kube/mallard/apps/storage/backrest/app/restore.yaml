---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: backrest
spec:
  policy:
    onMissingSnapshot: Continue
  source:
    fromPolicy:
      name: backrest
  target:
    populator: {}
  mover:
    securityContext:
      runAsUser: 0
      runAsGroup: 0
      runAsNonRoot: false
    privilegedMode: true
