---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: kopiur-r2
spec:
  allowedNamespaces:
    all: true
  backend:
    s3:
      bucket: kopiur
      endpoint: 1c2d6f23984731c937a088381b5861c0.r2.cloudflarestorage.com
      region: auto
      auth:
        secretRef:
          name: kopiur-r2
  encryption:
    passwordSecretRef:
      name: kopiur-r2
      namespace: storage
      key: KOPIA_PASSWORD
  maintenance:
    schedule:
      quick:
        cron: 0 */12 * * *
        jitter: 10m
      full:
        cron: 0 5 * * *
        jitter: 1h
  moverDefaults:
    cache:
      # Every cache PVC is 5Gi or larger (KOPIUR_CAPACITY default). Kopia's own
      # defaults are 5000 MiB per budget, larger than the whole PVC, so the
      # sweeper never runs and the cache fills the volume. The metadata budget
      # applies twice: kopia caps the index-blobs cache at the same size.
      contentCacheSizeMb: 512
      metadataCacheSizeMb: 1024
    podSecurityContext:
      supplementalGroups:
        - 1000
  parameters:
    epoch:
      minDuration: 1h
  scheduleDefaults:
    timezone: Europe/London
