---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kopiur
spec:
  chartRef:
    kind: OCIRepository
    name: kopiur
  interval: 1h
  values:
    podSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
    resources:
      requests:
        cpu: 100m
      limits:
        memory: 512Mi
    # extraVolumes:
    #   - name: repo
    #     hostPath:
    #       path: /var/mnt/ssd/k3s_storage/kopiur
    # extraVolumeMounts:
    #   - name: repo
    #     mountPath: /repo
