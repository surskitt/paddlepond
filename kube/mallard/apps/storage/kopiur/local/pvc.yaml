---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: kopiur-local
  labels:
    type: local
spec:
  storageClassName: manual-kopiur-local
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /var/mnt/ssd/k3s_storage/kopiur
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kopiur-local
spec:
  storageClassName: manual-kopiur-local
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
