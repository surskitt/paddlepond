---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: audiobookshelf
spec:
  chartRef:
    kind: OCIRepository
    name: audiobookshelf
  interval: 1h
  values:
    controllers:
      audiobookshelf:
        pod:
          securityContext:
            runAsUser: &uid 1000
            runAsGroup: &gid 1000
        containers:
          app:
            image:
              repository: ghcr.io/advplyr/audiobookshelf
              tag: 2.37.1
            env:
              TZ: "Europe/London"
              PORT: &port 13378
              AUDIOBOOKSHELF_UID: *uid
              AUDIOBOOKSHELF_GID: *gid
              CONFIG_PATH: /config
              METADATA_PATH: /config/metadata
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthcheck
                    port: *port
              readiness: *probes
    service:
      app:
        controller: audiobookshelf
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |
            group: media
        hostnames:
          - "audiobookshelf.${SECRET_DOMAIN}"
          - "abs.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: networking
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      config:
        enabled: true
        type: persistentVolumeClaim
        storageClass: local-hostpath
        accessMode: ReadWriteOnce
        size: 1Gi
        advancedMounts:
          audiobookshelf:
            app:
              - path: /config
        dataSourceRef:
          kind: ReplicationDestination
          apiGroup: volsync.backube
          name: audiobookshelf-restore
      logs:
        enabled: true
        type: persistentVolumeClaim
        storageClass: local-hostpath
        accessMode: ReadWriteOnce
        size: 1Gi
        advancedMounts:
          audiobookshelf:
            app:
              - path: /config/metadata/logs
      streams:
        enabled: true
        type: persistentVolumeClaim
        storageClass: local-hostpath
        accessMode: ReadWriteOnce
        size: 1Gi
        advancedMounts:
          audiobookshelf:
            app:
              - path: /config/metadata/streams
      media:
        enabled: true
        type: hostPath
        hostPath: /var/mnt/ssd/media
        advancedMounts:
          audiobookshelf:
            app:
              - path: /media
