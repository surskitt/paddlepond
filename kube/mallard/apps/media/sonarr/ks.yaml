---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: sonarr
spec:
  interval: 1h
  path: ./kube/mallard/apps/media/sonarr/app
  components:
    - ../../../../components/theme-park-body
  postBuild:
    substitute:
      APP: sonarr
      APP_ROUTE: sonarr
      THEME_PARK_APP: sonarr
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: media
  wait: false
