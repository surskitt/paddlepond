---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metube
spec:
  chartRef:
    kind: OCIRepository
    name: metube
  interval: 1h
  values:
    controllers:
      metube:
        containers:
          app:
            image:
              repository: ghcr.io/alexta69/metube
              tag: '2026.10.09'
            env:
              TZ: "Europe/London"
              OUTPUT_TEMPLATE: "%(upload_date)s - %(title)s - %(id)s (%(extractor)s).%(ext)s"
              YTDL_OPTIONS: >
                {
                  "merge_output_format": "mkv",
                  "noplaylist": true,
                  "subtitleslangs": ["en", "-live_chat"],
                  "updatetime": false,
                  "writesubtitles": true
                }
    service:
      app:
        ports:
          http:
            port: &port 8081
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |
            group: media
        hostnames:
          - "metube.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: networking
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      downloads:
        enabled: true
        type: hostPath
        hostPath: /mnt/ssd/media/downloads/ytdl
        advancedMounts:
          metube:
            app:
              - path: /downloads
