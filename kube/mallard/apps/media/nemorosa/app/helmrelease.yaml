---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nemorosa
spec:
  chartRef:
    kind: OCIRepository
    name: nemorosa
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      nemorosa:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image: 
              repository: ghcr.io/kyokomiki/nemorosa
              tag: 0.5.1
            args:
              - --server
            env:
              TZ: Europe/London
            resources:
              requests:
                cpu: 50m
                memory: 100Mi
              limits:
                memory: 512Mi
    service:
      app:
        primary: true
        controller: nemorosa
        ports:
          http:
            port: &port 8256
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |
            group: media
        hostnames:
          - "nemorosa.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: networking
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      config:
        type: persistentVolumeClaim
        storageClass: local-hostpath
        accessMode: ReadWriteOnce
        size: 1Gi
        advancedMounts:
          nemorosa:
            app:
              - path: /app/data/nemorosa
      config-file:
        type: secret
        name: nemorosa
        globalMounts:
          - path: /app/data/nemorosa/config.yml
            subPath: config.yml
            readOnly: true
      downloads:
        enabled: true
        type: hostPath
        hostPath: /var/mnt/ssd/media/downloads/torrents
        advancedMounts:
          nemorosa:
            app:
              - path: /downloads
