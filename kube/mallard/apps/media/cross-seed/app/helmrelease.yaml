---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cross-seed
spec:
  chartRef:
    kind: OCIRepository
    name: cross-seed
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      cross-seed:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/cross-seed/cross-seed
              tag: 6.13.9@sha256:9279fa3b4c6f09915614ec819c6dc97e1e844d863b35c009ababd54bad0489d5
            args:
              - daemon
              - -v
            env:
              TZ: "Europe/London"
              CROSS_SEED_PORT: &port 80
              CROSS_SEED_LINK_DIRS: "/downloads/cross-seed"
            envFrom:
              - secretRef:
                  name: cross-seed
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec: &probespec
                  httpGet:
                    path: /api/ping
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 10
                  failureThreshold: 3
              readiness: *probes
              startup:
                <<: *probes
                spec:
                  <<: *probespec
                  failureThreshold: 6
            securityContext:
              capabilities:
                drop:
                  - "ALL"
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
    service:
      app:
        controller: cross-seed
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |
            group: media
        hostnames:
          - "cross-seed.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: networking
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      config:
        enabled: true
        type: persistentVolumeClaim
        storageClass: local-hostpath
        accessMode: ReadWriteOnce
        size: 1Gi
      configjs:
        type: configMap
        name: cross-seed
        globalMounts:
          - path: /config/config.js
            subPath: config.js
            readOnly: true
      media:
        enabled: true
        type: hostPath
        hostPath: /var/mnt/ssd/media/downloads/torrents
        globalMounts:
          - path: /downloads
