---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: snapserver
spec:
  chartRef:
    kind: OCIRepository
    name: snapserver
  interval: 1h
  values:
    defaultPodOptions:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
    controllers:
      snapserver:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image: 
              repository: sweisgerber/snapcast
              tag: v0.35.0
          mpd:
            image:
              repository: tobi312/rpi-mpd
              tag: alphine@sha256:f3dd7073020b0eb86500121871f872b078634f69159f53cdbbf5de1bd983a456
          scrobbler:
            image:
              repository: giof71/mpd-scrobbler
              tag: alpine-0.24-r3-2023-03-03.1
            env:
              MPD_HOST: localhost
              MPD_PORT: 6601
              STARTUP_DELAY_SEC: 60
            envFrom:
              - secretRef:
                  name: snapserver
    service:
      app:
        primary: true
        controller: snapserver
        type: LoadBalancer
        externalTrafficPolicy: Local
        loadBalancerIP: 192.168.50.110
        annotations:
          lbipam.cilium.io/ips: 192.168.50.110
          "coredns.io/hostname": "snap-svc.${SECRET_DOMAIN}"
        ports:
          http:
            port: &port 1780
          audio:
            port: 1704
          control:
            port: 1705
          mpd:
            port: 6601
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |
            group: media
        hostnames:
          - "snap.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: networking
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      config:
        type: configMap
        name: snapserver-conf
        defaultMode: 0644
        advancedMounts:
          snapserver:
            app:
              - path: /config/snapserver.conf
                subPath: snapserver.conf
                readOnly: true
      mpd-conf:
        type: configMap
        name: mpd-conf
        defaultMode: 0644
        advancedMounts:
          snapserver:
            mpd:
              - path: /etc/mpd.conf
                subPath: mpd.conf
                readOnly: true
      data:
        type: persistentVolumeClaim
        storageClass: local-hostpath
        accessMode: ReadWriteOnce
        size: 1Gi
        advancedMounts:
          snapserver:
            app:
              - path: /data
      mpd-data:
        type: persistentVolumeClaim
        storageClass: local-hostpath
        accessMode: ReadWriteOnce
        size: 1Gi
        advancedMounts:
          snapserver:
            mpd:
              - path: /data
      fifo:
        enabled: true
        type: emptyDir
      music:
        enabled: true
        type: hostPath
        hostPath: /var/mnt/ssd/media/music
        advancedMounts:
          snapserver:
            mpd:
              - path: /music
