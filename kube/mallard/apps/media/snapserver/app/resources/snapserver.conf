[server]
datadir = /data/

[http]
enabled = true

bind_to_address = 0.0.0.0
port = 1780

doc_root = /usr/share/snapweb

[tcp]
enabled = true

bind_to_address = 0.0.0.0
port = 1705

[stream]
bind_to_address = 0.0.0.0
port = 1704

source = pipe:////fifo/mpd2snap?name=mpd

sampleformat = 48000:16:2
codec = pcm
buffer = 1000
send_to_muted = false

[streaming_client]
initial_volume = 100

[logging]
