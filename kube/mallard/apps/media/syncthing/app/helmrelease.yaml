---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: syncthing
spec:
  chartRef:
    kind: OCIRepository
    name: syncthing
  interval: 1h
  values:
    controllers:
      syncthing:
        containers:
          app:
            image:
              repository: syncthing/syncthing
              tag: 2.1.7
            env:
              PUID: "1000"
              PGID: "1000"
            resources:
              requests:
                cpu: 15m
                memory: 249Mi
              limits:
                memory: 265Mi
    service:
      app:
        ports:
          http:
            port: &port 8384
      listdisc:
        enabled: true
        controller: syncthing
        type: LoadBalancer
        externalTrafficPolicy: Local
        loadBalancerIP: 192.168.50.108
        annotations:
          lbipam.cilium.io/ips: 192.168.50.108
          "coredns.io/hostname": "syncthing-svc.${SECRET_DOMAIN}"
        ports:
          discovery:
            enabled: true
            port: 21027
            protocol: UDP
          listen:
            enabled: true
            port: 22000
            protocol: TCP
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |
            group: media
        hostnames:
          - "syncthing.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: networking
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      config:
        enabled: true
        type: persistentVolumeClaim
        storageClass: local-hostpath
        accessMode: ReadWriteOnce
        size: 10Gi
        advancedMounts:
          syncthing:
            app:
              - path: /var/syncthing
        retain: true
        dataSourceRef:
          kind: ReplicationDestination
          apiGroup: volsync.backube
          name: syncthing-restore
      data:
        enabled: true
        type: hostPath
        hostPath: /var/mnt/ssd
        advancedMounts:
          syncthing:
            app:
              - path: /data
