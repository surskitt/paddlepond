---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mousetrap
spec:
  chartRef:
    kind: OCIRepository
    name: mousetrap
  interval: 1h
  values:
    controllers:
      mousetrap:
        containers:
          app:
            image:
              repository: ghcr.io/sirjmann92/mousetrap
              tag: 2.6.2@sha256:ac1b8758f3a28f3ce6107c444290e1183e7fb2a8ff2a1966ac4bd706fd3f43e6
            env:
              TZ: "Europe/London"
              PUID: 1000
              PGID: 1000
              CONFIG_DIR: /config/mousetrap
            envFrom:
              - secretRef:
                  name: mousetrap
    service:
      app:
        controller: mousetrap
        ports:
          http:
            port: &port 39842
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |
            name: mousetrap
            group: media
        hostnames:
          - "mam.${SECRET_DOMAIN}"
          - "mousetrap.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: networking
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      config:
        enabled: true
        type: persistentVolumeClaim
        storageClass: local-hostpath
        accessMode: ReadWriteOnce
        size: 1Gi
        dataSourceRef:
          kind: ReplicationDestination
          apiGroup: volsync.backube
          name: mousetrap-restore
