---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: qbittorrent
spec:
  interval: 1h
  path: ./kube/mallard/apps/media/qbittorrent/app
  components:
    - ../../../../components/theme-park
  postBuild:
    substitute:
      APP: qbittorrent
      APP_ROUTE: qbittorrent-app
      # THEME_PARK_APP: vuetorrent
      THEME_PARK_APP: qbittorrent
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: media
  wait: false
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mousetrap
spec:
  interval: 1h
  path: ./kube/mallard/apps/media/qbittorrent/mousetrap
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: media
  wait: false
