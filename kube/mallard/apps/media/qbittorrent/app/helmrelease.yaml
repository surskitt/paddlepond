---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qbittorrent
spec:
  chartRef:
    kind: OCIRepository
    name: qbittorrent
  interval: 1h
  values:
    defaultPodOptions:
      terminationGracePeriodSeconds: 300
    controllers:
      qbittorrent:
        initContainers:
          coredns:
            image:
              repository: mirror.gcr.io/coredns/coredns
              tag: 1.12.0
            args:
              - -conf
              - /etc/coredns/Corefile
            restartPolicy: Always
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
          gluetun:
            dependsOn:
              - coredns
            image:
              repository: ghcr.io/qdm12/gluetun
              tag: v3.41.3
            env:
              DNS_ADDRESS: "127.0.0.2"
              DOT: "off"
              VPN_TYPE: wireguard
              VPN_INTERFACE: wg0
              FIREWALL_INPUT_PORTS: "80,8000,8080,9999,39842"
              FIREWALL_OUTBOUND_SUBNETS: 10.42.0.0/16,10.43.0.0/16 # Allow access to k8s subnets
              HEALTH_SERVER_ADDRESS: ":9999"
              VPN_SERVICE_PROVIDER: protonvpn
              SERVER_COUNTRIES: United Kingdom
              PORT_FORWARD_ONLY: on
              VPN_PORT_FORWARDING: on
              VPN_PORT_FORWARDING_PROVIDER: protonvpn
              WIREGUARD_PRIVATE_KEY: "${SECRET_WIREGUARD_PROTON_PRIVATE_KEY}"
              VPN_PORT_FORWARDING_UP_COMMAND: "/scripts/gluetun-up.sh {{` {{PORTS}} `}}"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 9999
                  timeoutSeconds: 10
                  periodSeconds: 30
                  failureThreshold: 5
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 9999
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  failureThreshold: 5
            restartPolicy: Always
            securityContext:
              capabilities:
                add:
                  - NET_ADMIN
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/qbittorrent-libtorrentv1
              tag: 5.2.4@sha256:6c303adb93d995ba33dcdce45ee89181a370b6ad745b4148e7f73bde43e5d482
            env:
              TZ: "Europe/London"
              UMASK: "022"
              QBT_WEBUI_PORT: &port 8080
              QBT_Preferences__WebUI__AuthSubnetWhitelistEnabled: true
              QBT_Preferences__WebUI__AuthSubnetWhitelist: |-
                10.42.0.0/16, 10.20.0.0/24
              QBT_BitTorrent__Session__Interface: wg0
              QBT_BitTorrent__Session__InterfaceAddress: "0.0.0.0"
              QBT_BitTorrent__Session__InterfaceName: wg0
              QBT_Preferences__WebUI__AlternativeUIEnabled: true
              QBT_Preferences__WebUI__RootFolder: /add-ons/VueTorrent
            envFrom:
              - secretRef:
                  name: qbittorrent
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
            resources:
              requests:
                cpu: 300m
                memory: 1Gi
              limits:
                memory: 3Gi
          # vuetorrent:
          #   dependsOn: app
          #   image:
          #     repository: registry.k8s.io/git-sync/git-sync
          #     tag: v4.6.0
          #   args:
          #     - --repo=https://github.com/WDaan/VueTorrent
          #     - --ref=latest-release
          #     - --period=86400s
          #     - --root=/add-ons
          #   securityContext:
          #     runAsUser: 1000
          #     runAsGroup: 1000
          mousetrap:
            image:
              repository: ghcr.io/sirjmann92/mousetrap
              tag: 2.6.1@sha256:146eaabcd799052d0832942012c0a537ab34f807d3f0a95b7d51e0ca2083241a
            env:
              TZ: "Europe/London"
              PUID: 1000
              PGID: 1000
              CONFIG_DIR: /config/mousetrap
          speedtest:
            image:
              repository: lscr.io/linuxserver/speedtest-tracker
              tag: 1.15.1
            env:
              PUID: 1000
              PGID: 1000
              APP_KEY:
                valueFrom:
                  secretKeyRef:
                    name: qbittorrent
                    key: SPEEDTEST_APP_KEY
              APP_URL: &speedtesturl "https://qbspeed.${SECRET_DOMAIN}"
              ASSET_URL: *speedtesturl
              DISPLAY_TIMEZONE: "Europe/London"
              DB_CONNECTION: sqlite
              SPEEDTEST_SCHEDULE: "30 * * * *"
              SPEEDTEST_INTERFACE: wg0
    service:
      app:
        controller: qbittorrent
        ports:
          http:
            port: *port
          mousetrap:
            port: &mamport 39842
          speedtest:
            port: &speedtestport 80
          gluetun:
            port: 8000
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |
            name: qbittorrent
            group: media
        hostnames:
          - "qb.${SECRET_DOMAIN}"
          - "qbittorrent.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: networking
        rules:
          - backendRefs:
              - identifier: app
                port: *port
      mousetrap:
        annotations:
          gatus.home-operations.com/endpoint: |
            name: mousetrap
            group: media
        hostnames:
          - "mam.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: networking
        rules:
          - backendRefs:
              - identifier: app
                port: *mamport
      speedtest:
        annotations:
          gatus.home-operations.com/endpoint: |
            name: qbittorrent speed test
            group: media
        hostnames:
          - "qbspeed.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: networking
        rules:
          - backendRefs:
              - identifier: app
                port: *speedtestport
    persistence:
      config:
        enabled: true
        type: persistentVolumeClaim
        storageClass: local-hostpath
        accessMode: ReadWriteOnce
        size: 1Gi
        dataSourceRef:
          kind: ReplicationDestination
          apiGroup: volsync.backube
          name: qbittorrent-restore
      scripts:
        type: configMap
        name: qbittorrent-scripts
        defaultMode: 0775
        globalMounts:
          - readOnly: true
      downloads:
        enabled: true
        type: hostPath
        hostPath: /var/mnt/ssd/media/downloads/torrents
        globalMounts:
          - path: /downloads
      add-ons:
        enabled: true
        type: image
        image: ghcr.io/vuetorrent/vuetorrent-lsio-mod:2.36.1
        # type: emptyDir
        # globalMounts:
        #   - path: /add-ons
      coredns:
        type: configMap
        name: qbittorrent-coredns
        advancedMounts:
          qbittorrent:
            coredns:
              - path: /etc/coredns/Corefile
                subPath: Corefile
                readOnly: true
      gluetun-config:
        type: secret
        name: gluetun-config
        advancedMounts:
          qbittorrent:
            gluetun:
              - path: /gluetun/auth/config.toml
                subPath: config.toml
                readOnly: true
  valuesFrom:
    - kind: ConfigMap
      name: qbittorrent-values
      valuesKey: values
      optional: true
