---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qbittorrent
spec:
  chartRef:
    kind: OCIRepository
    name: qbittorrent
  interval: 1h
  timeout: 15m
  values:
    defaultPodOptions:
      terminationGracePeriodSeconds: 120
    controllers:
      qbittorrent:
        initContainers:
          coredns:
            image:
              repository: mirror.gcr.io/coredns/coredns
              tag: 1.15.0
            args:
              - -conf
              - /etc/coredns/Corefile
            restartPolicy: Always
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
          gluetun:
            dependsOn:
              - coredns
            image:
              repository: ghcr.io/qdm12/gluetun
              tag: v3.41.3
            env:
              DNS_ADDRESS: "127.0.0.2"
              DOT: "off"
              VPN_TYPE: wireguard
              VPN_INTERFACE: wg0
              FIREWALL_INPUT_PORTS: "7575,8000,8080,8888,9999"
              FIREWALL_OUTBOUND_SUBNETS: 10.42.0.0/16,10.43.0.0/16 # Allow access to k8s subnets
              HEALTH_SERVER_ADDRESS: ":9999"
              VPN_SERVICE_PROVIDER: protonvpn
              SERVER_CITIES: London
              PORT_FORWARD_ONLY: on
              VPN_PORT_FORWARDING: on
              VPN_PORT_FORWARDING_PROVIDER: protonvpn
              WIREGUARD_PRIVATE_KEY: "${SECRET_WIREGUARD_PROTON_PRIVATE_KEY}"
              VPN_PORT_FORWARDING_UP_COMMAND: "/scripts/gluetun-up.sh {{` {{PORTS}} `}}"
              HTTPPROXY: "on"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 9999
                  timeoutSeconds: 10
                  periodSeconds: 30
                  failureThreshold: 5
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 9999
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  failureThreshold: 5
            restartPolicy: Always
            securityContext:
              capabilities:
                add:
                  - NET_ADMIN
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/qbittorrent-libtorrentv1
              tag: 5.2.4@sha256:6c303adb93d995ba33dcdce45ee89181a370b6ad745b4148e7f73bde43e5d482
            env:
              TZ: "Europe/London"
              UMASK: "022"
              QBT_WEBUI_PORT: &port 8080
              QBT_Preferences__WebUI__AuthSubnetWhitelistEnabled: true
              QBT_Preferences__WebUI__AuthSubnetWhitelist: |-
                10.42.0.0/16, 10.20.0.0/24
              QBT_BitTorrent__Session__Interface: wg0
              QBT_BitTorrent__Session__InterfaceAddress: "0.0.0.0"
              QBT_BitTorrent__Session__InterfaceName: wg0
              QBT_Preferences__WebUI__AlternativeUIEnabled: true
              QBT_Preferences__WebUI__RootFolder: /add-ons/VueTorrent
            envFrom:
              - secretRef:
                  name: qbittorrent
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
            resources:
              requests:
                cpu: 300m
                memory: 1Gi
              limits:
                memory: 3Gi
          netronome:
            image: 
              repository: ghcr.io/autobrr/netronome
              tag: v0.16.0@sha256:e6e43960e60e5a84e1eff325af179ebe383ea3c63b57a142d696729f825e867b
            env:
              NETRONOME__DB_PATH: /config/netronome/netronome.db
              NETRONOME__HOST: 0.0.0.0
              NETRONOME__PORT: &nnport 7575
              NETRONOME__IPERF_TEST_DURATION: "10"
              NETRONOME__IPERF_PARALLEL_CONNS: "4"
              NETRONOME__PACKETLOSS_ENABLED: "true"
              NETRONOME__PACKETLOSS_PRIVILEGED_MODE: "false"
              NETRONOME__PACKETLOSS_DEFAULT_INTERVAL: "3600"
              NETRONOME__PACKETLOSS_RESTORE_MONITORS_ON_STARTUP: "true"
              NETRONOME__MONITOR_ENABLED: "true"
              TZ: Europe/London
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 5m
                memory: 50Mi
              limits:
                memory: 256Mi
          watchdog:
            image:
              repository: ghcr.io/brunoorsolon/gluetun-qbt-watchdog
              tag: 2.1.1@sha256:61068f7412b6ab2a8c53148773b465b6c86032460cbf6798b64eb7ca184ad904
            command: ["/scripts/gluetun-qbt-watchdog.sh"]
            envFrom:
              - secretRef:
                  name: qbittorrent
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
    service:
      app:
        controller: qbittorrent
        ports:
          http:
            port: *port
          netronome:
            port: *nnport
          gluetun:
            port: 8000
          gluetunproxy:
            port: 8888
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |
            name: qbittorrent
            group: media
        hostnames:
          - "qb.${SECRET_DOMAIN}"
          - "qbittorrent.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: networking
        rules:
          - backendRefs:
              - identifier: app
                port: *port
      netronome:
        annotations:
          gatus.home-operations.com/endpoint: |
            name: qbittorrent speedtest
            group: media
        hostnames:
          - "qbnn.${SECRET_DOMAIN}"
          - "qbspeed.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: networking
        rules:
          - backendRefs:
              - identifier: app
                port: *nnport
    persistence:
      config:
        enabled: true
        type: persistentVolumeClaim
        storageClass: local-hostpath
        accessMode: ReadWriteOnce
        size: 1Gi
        dataSourceRef:
          kind: ReplicationDestination
          apiGroup: volsync.backube
          name: qbittorrent-restore
      scripts:
        type: configMap
        name: qbittorrent-scripts
        defaultMode: 0775
        globalMounts:
          - readOnly: true
      downloads:
        enabled: true
        type: hostPath
        hostPath: /var/mnt/ssd/media/downloads/torrents
        globalMounts:
          - path: /downloads
      add-ons:
        enabled: true
        type: image
        image: ghcr.io/vuetorrent/vuetorrent-lsio-mod:2.36.1
      coredns:
        type: configMap
        name: qbittorrent-coredns
        advancedMounts:
          qbittorrent:
            coredns:
              - path: /etc/coredns/Corefile
                subPath: Corefile
                readOnly: true
      gluetun-config:
        type: secret
        name: gluetun-config
        advancedMounts:
          qbittorrent:
            gluetun:
              - path: /gluetun/auth/config.toml
                subPath: config.toml
                readOnly: true
  valuesFrom:
    - kind: ConfigMap
      name: qbittorrent-values
      valuesKey: values
      optional: true
