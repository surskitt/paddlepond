---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: aria2
spec:
  chartRef:
    kind: OCIRepository
    name: aria2
  interval: 1h
  values:
    controllers:
      aria2:
        containers:
          app:
            image:
              repository: p3terx/aria2-pro
              tag: "202209060423"
            # securityContext:
            #   runAsUser: 1000
            #   runAsGroup: 1000
    service:
      app:
        type: LoadBalancer
        externalTrafficPolicy: Local
        loadBalancerIP: 192.168.50.109
        annotations:
          lbipam.cilium.io/ips: 192.168.50.109
          "coredns.io/hostname": "aria2-svc.${SECRET_DOMAIN}"
        ports:
          http:
            enabled: true
            port: &port 6800
    route:
      app:
        annotations:
          gatus.home-operations.com/enabled: "false"
        hostnames:
          - "aria2.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: networking
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      config:
        enabled: true
        type: persistentVolumeClaim
        storageClass: local-hostpath
        accessMode: ReadWriteOnce
        size: 1Gi
        retain: true
        dataSourceRef:
          kind: ReplicationDestination
          apiGroup: volsync.backube
          name: aria2-restore
      downloads:
        enabled: true
        type: hostPath
        hostPath: /var/mnt/ssd/media/downloads/aria2
        advancedMounts:
          aria2:
            app:
              - path: /downloads
