---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: radarr
spec:
  interval: 1h
  path: ./kube/mallard/apps/media/radarr/app
  components:
    - ../../../../components/theme-park
  postBuild:
    substitute:
      APP: radarr
      APP_ROUTE: radarr
      THEME_PARK_APP: radarr
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: media
  wait: false
