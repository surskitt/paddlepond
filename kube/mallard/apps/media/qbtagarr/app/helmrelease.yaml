---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qbtagarr
spec:
  chartRef:
    kind: OCIRepository
    name: qbtagarr
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      qbtagarr:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image: 
              repository: ghcr.io/surskitt/qbtagarr
              tag: 0.1.0-16
            env:
              QBTAGARR_CONFIG_FILE: /config/qbtagarr.yaml
            resources:
              requests:
                cpu: 50m
                memory: 100Mi
              limits:
                memory: 300Mi
    service:
      app:
        primary: true
        controller: qbtagarr
        ports:
          http:
            port: &port 8080
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |
            group: media
        hostnames:
          - "qbtagarr.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: networking
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      config:
        type: emptyDir
      config-file:
        type: secret
        name: qbtagarr
        globalMounts:
          - path: /config/qbtagarr.yaml
            subPath: qbtagarr.yaml
            readOnly: true
