---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plex
spec:
  chartRef:
    kind: OCIRepository
    name: plex
  interval: 1h
  values:
    defaultPodOptions:
      # nodeSelector:
      #   intel.feature.node.kubernetes.io/gpu: "true"
      securityContext:
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups:
          - 44
          - 105
          - 10000
          - 1000
    controllers:
      plex:
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/plex
              tag: 1.43.4.10903@sha256:fdc6fe82bc7d8acd08fc0aa581fcb76722803ba5905e2537135a697347dd6149
            env:
              TZ: Europe/London
              PLEX_ADVERTISE_URL: https://192.168.50.106:32400,https://plex.${SECRET_DOMAIN}:443
              PLEX_NO_AUTH_NETWORKS: 192.168.0.0/16
            resources:
              requests:
                gpu.intel.com/i915: 1
                cpu: 100m
                memory: 2000Mi
              limits:
                gpu.intel.com/i915: 1
                memory: 7000Mi
        type: statefulset
        annotations:
          reloader.stakater.com/auto: "true"
    service:
      app:
        type: LoadBalancer
        externalTrafficPolicy: Local
        loadBalancerIP: 192.168.50.106
        ports:
          http:
            port: &port 32400
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |
            group: media
        hostnames:
          - "plex.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: networking
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      config:
        enabled: true
        type: persistentVolumeClaim
        storageClass: local-hostpath
        accessMode: ReadWriteOnce
        size: 20Gi
        globalMounts:
          - path: /config
        dataSourceRef:
          kind: ReplicationDestination
          apiGroup: volsync.backube
          name: plex-restore
      plugindata:
        enabled: true
        type: persistentVolumeClaim
        storageClass: local-hostpath
        accessMode: ReadWriteOnce
        size: 20Gi
        globalMounts:
          - path: "/config/Library/Application Support/Plex Media Server/Plug-in Support/Data"
      plexcache:
        enabled: true
        type: persistentVolumeClaim
        storageClass: local-hostpath
        accessMode: ReadWriteOnce
        size: 20Gi
        globalMounts:
          - path: "/config/Library/Application Support/Plex Media Server/Cache"
      logs:
        enabled: true
        type: persistentVolumeClaim
        storageClass: local-hostpath
        accessMode: ReadWriteOnce
        size: 20Gi
        globalMounts:
          - path: "/config/Library/Application Support/Plex Media Server/Logs"
      mediacache:
        enabled: true
        type: persistentVolumeClaim
        storageClass: local-hostpath
        accessMode: ReadWriteOnce
        size: 20Gi
        globalMounts:
          - path: "/config/Library/Application Support/Plex Media Server/Media"
      scanners:
        enabled: true
        type: persistentVolumeClaim
        storageClass: local-hostpath
        accessMode: ReadWriteOnce
        size: 20Gi
        globalMounts:
          - path: "/config/Library/Application Support/Plex Media Server/Scanners"
      metadata:
        enabled: true
        type: persistentVolumeClaim
        storageClass: local-hostpath
        accessMode: ReadWriteOnce
        size: 20Gi
        globalMounts:
          - path: "/config/Library/Application Support/Plex Media Server/Metadata"
      codecs:
        enabled: true
        type: persistentVolumeClaim
        storageClass: local-hostpath
        accessMode: ReadWriteOnce
        size: 20Gi
        globalMounts:
          - path: "/config/Library/Application Support/Plex Media Server/Codecs"
      crash:
        enabled: true
        type: persistentVolumeClaim
        storageClass: local-hostpath
        accessMode: ReadWriteOnce
        size: 20Gi
        globalMounts:
          - path: "/config/Library/Application Support/Plex Media Server/Crash Reports"
      drivers:
        enabled: true
        type: persistentVolumeClaim
        storageClass: local-hostpath
        accessMode: ReadWriteOnce
        size: 20Gi
        globalMounts:
          - path: "/config/Library/Application Support/Plex Media Server/Drivers"
      media:
        enabled: true
        type: hostPath
        hostPath: /var/mnt/ssd/media/
        advancedMounts:
          plex:
            app:
              - path: /media
      transcode:
        enabled: true
        type: emptyDir
