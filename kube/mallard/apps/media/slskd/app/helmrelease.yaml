---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: slskd
spec:
  chartRef:
    kind: OCIRepository
    name: slskd
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      slskd:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          coredns:
            image:
              repository: mirror.gcr.io/coredns/coredns
              tag: 1.12.0
            args:
              - -conf
              - /etc/coredns/Corefile
            restartPolicy: Always
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
          gluetun:
            dependsOn:
              - coredns
            image:
              repository: ghcr.io/qdm12/gluetun
              tag: v3.41.1
            env:
              DNS_ADDRESS: "127.0.0.2"
              DOT: "off"
              VPN_TYPE: wireguard
              VPN_INTERFACE: wg0
              FIREWALL_INPUT_PORTS: "80,8000,9999"
              FIREWALL_OUTBOUND_SUBNETS: 10.42.0.0/16,10.43.0.0/16 # Allow access to k8s subnets
              HEALTH_SERVER_ADDRESS: ":9999"
              VPN_SERVICE_PROVIDER: protonvpn
              SERVER_COUNTRIES: United Kingdom
              PORT_FORWARD_ONLY: on
              VPN_PORT_FORWARDING: on
              VPN_PORT_FORWARDING_PROVIDER: protonvpn
              WIREGUARD_PRIVATE_KEY: "${SECRET_WIREGUARD_SLSKD_PROTON_PRIVATE_KEY}"
            envFrom:
              - secretRef:
                  name: slskd
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 9999
                  timeoutSeconds: 10
                  periodSeconds: 30
                  failureThreshold: 5
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 9999
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  failureThreshold: 5
            restartPolicy: Always
            securityContext:
              capabilities:
                add:
                  - NET_ADMIN
        containers:
          app:
            image: 
              repository: ghcr.io/slskd/slskd
              tag: 0.26.0@sha256:ecd4026d4f8fb504e2cc55323efa2c1f5b56d20d3686b018249cc36b48ea17a6
            env:
              DOTNET_BUNDLE_EXTRACT_BASE_DIR: /tmp/.net
              TZ: Europe/London
              SLSKD_APP_DIR: /config
              SLSKD_HTTP_PORT: &port 80
              SLSKD_NO_HTTPS: true
              SLSKD_NO_AUTH: true
              SLSKD_DOWNLOADS_DIR: /media/downloads/soulseek/complete
              SLSKD_INCOMPLETE_DIR: /media/downloads/soulseek/incomplete
              SLSKD_SHARED_DIR: /media/downloads/soulseek/shared
              SLSKD_SHARE_FILTER: '\.ini$;Thumbs.db$;\.DS_Store$'
              SLSKD_REMOTE_CONFIGURATION: false
              SLSKD_FILE_PERMISSION_MODE: 750
              SLSKD_NO_VERSION_CHECK: true
              SLSKD_VPN: true
              SLSKD_VPN_PORT_FORWARDING: true
              SLSKD_VPN_GLUETUN_URL: http://localhost:8000
            envFrom:
              - secretRef:
                  name: slskd
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 1Gi
    service:
      app:
        primary: true
        ports:
          http:
            port: *port
          gluetun:
            port: 8000
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |
            group: media
        hostnames:
          - "nemorosa.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: networking
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      config:
        enabled: true
        type: persistentVolumeClaim
        storageClass: local-hostpath
        accessMode: ReadWriteOnce
        size: 1Gi
        dataSourceRef:
          kind: ReplicationDestination
          apiGroup: volsync.backube
          name: slskd-restore
      config-file:
        type: secret
        name: slskd-yaml
        defaultMode: 0775
        globalMounts:
          - path: /config/slskd.yml
            subPath: slskd.yml
            readOnly: true
      media:
        enabled: true
        type: hostPath
        hostPath: /mnt/ssd/media
        advancedMounts:
          slskd:
            app:
              - path: /media
      tmp:
        type: emptyDir
      coredns:
        type: configMap
        name: slskd-coredns
        advancedMounts:
          slskd:
            coredns:
              - path: /etc/coredns/Corefile
                subPath: Corefile
                readOnly: true
      gluetun-config:
        type: secret
        name: slskd-gluetun-config
        advancedMounts:
          slskd:
            gluetun:
              - path: /gluetun/auth/config.toml
                subPath: config.toml
                readOnly: true
  valuesFrom:
    - kind: ConfigMap
      name: slskd-values
      valuesKey: values
      optional: true
