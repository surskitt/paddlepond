---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: media
resources:
  - ./secret.sops.yaml
  - ./helmrelease.yaml
  - ./restore.yaml
  - ./backup.yaml
  - ./gatus.yaml
configMapGenerator:
  - name: navidrome
    files:
      - navidrome.toml=./resources/navidrome.toml
      - navidrome_queue_to_playlist.py=./resources/navidrome_queue_to_playlist.py
generatorOptions:
  disableNameSuffixHash: true
