---
# yaml-language-server: $schema=https://raw.githubusercontent.com/recyclarr/recyclarr/master/schemas/config-schema.json

sonarr:
  series:
    base_url: http://sonarr.media.svc.cluster.local:8989
    api_key: !env_var SONARR__API_KEY
    delete_old_custom_formats: true
    quality_definition:
      type: series

    quality_profiles:
      - trash_id: e58cf4e090184db3b3d7c79c1a9e9b4a # Base
        name: All
        reset_unmatched_scores:
          enabled: true

      - trash_id: fe9470e577c300a5ad9a3274f6d1cdf2  # Remux + WEB 1080p
        name: Remux + WEB 1080p
        min_upgrade_format_score: 5
        reset_unmatched_scores:
          enabled: true

      - trash_id: 76a5053bdb2d1e4a8f16a69a37d46c12  # Remux + WEB 2160p
        name: Remux + WEB 2160p
        min_upgrade_format_score: 5
        reset_unmatched_scores:
          enabled: true

      - trash_id: 361717d531db5a6002e0f547ace46551  # Remux 2160p (Alternative)
        name: Remux 2160p (Alternative)
        min_upgrade_format_score: 5
        reset_unmatched_scores:
          enabled: true

      - trash_id: 72dae194fc92bf828f32cde7744e51a1  # WEB-1080p
        name: WEB-1080p
        min_upgrade_format_score: 5
        reset_unmatched_scores:
          enabled: true

      - trash_id: 9d142234e45d6143785ac55f5a9e8dc9  # WEB-1080p (Alternative)
        name: WEB-1080p (Alternative)
        min_upgrade_format_score: 5
        reset_unmatched_scores:
          enabled: true

      - trash_id: d1498e7d189fbe6c7110ceaabb7473e6  # WEB-2160p
        name: WEB-2160p
        min_upgrade_format_score: 5
        reset_unmatched_scores:
          enabled: true

      - trash_id: 20e0fc959f1f1704bed501f23bdae76f # [Anime] Remux-1080p
        name: Remux-1080p - Anime
        reset_unmatched_scores:
          enabled: true

    custom_formats:
      # FLUX trumps REPACKS
      - trash_ids:
          - 5d9fd1b1e06cd8a475462f40214b7df6  # FLUX
        assign_scores_to:
          - name: Remux + WEB 1080p
            score: 100
          - name: Remux + WEB 2160p
            score: 100
          - name: Remux 2160p (Alternative)
            score: 100
          - name: WEB-1080p
            score: 100
          - name: WEB-1080p (Alternative)
            score: 100
          - name: WEB-2160p
            score: 100

      - trash_ids:
          - d7c747094a7c65f4c2de083c24899e8b  # FreeLeech
        assign_scores_to:
          - name: Remux + WEB 1080p
          - name: Remux + WEB 2160p
          - name: Remux 2160p (Alternative)
          - name: WEB-1080p
          - name: WEB-1080p (Alternative)
          - name: WEB-2160p

      - trash_ids:
          - 32b367365729d530ca1c124a0b180c64  # Bad Dual Groups
          - 82d40da2bc6923f41e14394075dd4b03  # No-RlsGroup
          - e1a997ddb54e3ecbfe06341ad323c458  # Obfuscated
          - 06d66ab109d4d2eddb2794d21526d140  # Retags
        assign_scores_to:
          - name: Remux + WEB 1080p
            score: -10000
          - name: Remux + WEB 2160p
            score: -10000
          - name: Remux 2160p (Alternative)
            score: -10000
          - name: WEB-1080p
            score: -10000
          - name: WEB-1080p (Alternative)
            score: -10000
          - name: WEB-2160p
            score: -10000

      - trash_ids:
          - 1b3994c551cbb92a2c781af061f4ab44  # Scene
        assign_scores_to:
          - name: Remux + WEB 1080p
            score: 0
          - name: Remux + WEB 2160p
            score: 0
          - name: Remux 2160p (Alternative)
            score: 0
          - name: WEB-1080p
            score: 0
          - name: WEB-1080p (Alternative)
            score: 0
          - name: WEB-2160p
            score: 0

      - trash_ids:
          - 9b27ab6498ec0f31a3353992e19434ca  # DV (WEBDL)
        assign_scores_to:
          - name: Remux + WEB 2160p
          - name: Remux 2160p (Alternative)
          - name: WEB-2160p

