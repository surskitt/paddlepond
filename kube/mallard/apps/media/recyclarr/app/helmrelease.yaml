---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: recyclarr
spec:
  chartRef:
    kind: OCIRepository
    name: recyclarr
  interval: 1h
  values:
    controllers:
      recyclarr:
        containers:
          app:
            image:
              repository: ghcr.io/recyclarr/recyclarr
              tag: 7.5.2
            env:
              TZ: Europe/London
            envFrom:
              - secretRef:
                  name: radarr
              - secretRef:
                  name: sonarr
            resources:
              requests:
                cpu: 10m
                memory: 50Mi
              limits:
                memory: 200Mi
        annotations:
          reloader.stakater.com/auto: "true"
    service:
      app:
        enabled: false
    persistence:
      yaml:
        enabled: true
        type: configMap
        name: recyclarr
        advancedMounts:
          recyclarr:
            app:
              - path: /config/recyclarr.yml
                subPath: recyclarr.yml
                readOnly: true
      config:
        enabled: true
        type: persistentVolumeClaim
        storageClass: local-hostpath
        accessMode: ReadWriteOnce
        size: 1Gi
