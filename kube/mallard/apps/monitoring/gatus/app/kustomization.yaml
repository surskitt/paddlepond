---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - ./ocirepository.yaml
  - ./secret.sops.yaml
  - ./helmrelease.yaml
configMapGenerator:
  - name: gatus-config
    files:
      - ./config/config.yaml
  - name: gatus-qbittorrent-port-endpoint
    files:
      - ./config/qbittorrent-port-endpoint.yaml
  - name: gatus-slskd-port-endpoint
    files:
      - ./config/slskd-port-endpoint.yaml
  - name: gatus-healthchecksio-endpoint
    files:
      - ./config/healthchecksio-endpoint.yaml
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
