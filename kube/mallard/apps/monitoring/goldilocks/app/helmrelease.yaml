---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2beta1.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: goldilocks
spec:
  interval: 30m
  chart:
    spec:
      chart: goldilocks
      version: 11.2.0
      sourceRef:
        kind: HelmRepository
        name: fairwinds
        namespace: flux-system
  values:
    controller:
      resources:
        requests:
          cpu: 15m
          memory: 100M
        limits:
          memory: 300M
    dashboard:
      replicaCount: 1
      resources:
        requests:
          cpu: 15m
          memory: 64Mi
        limits:
          memory: 105M
      httpRoute:
        enabled: true
        annotations:
          gatus.home-operations.com/endpoint: |
            group: monitoring
        hostnames:
          - "goldilocks.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: networking
