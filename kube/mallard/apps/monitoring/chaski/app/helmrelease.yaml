# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: chaski
spec:
  chartRef:
    kind: OCIRepository
    name: chaski
  interval: 1h
  values:
    replicaCount: 1
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    env:
      TZ: Europe/London
    envFrom:
      - secretRef:
          name: chaski-env
    config:
      targets:
        ntfy:
          http:
            url: https://ntfy.sh/mallard-mousetrap-{{ env "NTFY_TOKEN" }}
            method: POST
      routes:
        mousetrap:
          target: ntfy
          message: "{{ .payload.message }}"
          headers:
            Title: Mousetrap
            Tags: duck,mouse
    resources:
      requests:
        cpu: 10m
      limits:
        memory: 50Mi
