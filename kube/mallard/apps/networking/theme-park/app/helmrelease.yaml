---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: theme-park
spec:
  chartRef:
    kind: OCIRepository
    name: theme-park
  interval: 1h
  values:
    controllers:
      theme-park:
        containers:
          app:
            image:
              repository: ghcr.io/benwalio/theme-park
              tag: 1.22.1@sha256:156cb48781cddcc8d6a418051cdc20535889f3f0d3fafd3a52805d1d89e3324d 
            resources:
              requests:
                cpu: 5m
                memory: 10Mi
              limits:
                memory: 100Mi
    service:
      app:
        ports:
          http:
            port: &port 8080
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |
            group: networking
        hostnames:
          - "theme-park.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: networking
        rules:
          - backendRefs:
              - identifier: app
                port: *port
