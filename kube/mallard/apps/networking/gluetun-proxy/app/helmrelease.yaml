---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gluetun-proxy
spec:
  chartRef:
    kind: OCIRepository
    name: gluetun-proxy
  interval: 1h
  values:
    controllers:
      gluetun:
        containers:
          gluetun:
            image:
              repository: ghcr.io/qdm12/gluetun
              tag: v3.41.3
            env:
              DOT: "off"
              BLOCK_MALICIOUS: "off"
              VPN_TYPE: wireguard
              VPN_INTERFACE: wg0
              FIREWALL_INPUT_PORTS: "8388,8888,9999"
              HEALTH_SERVER_ADDRESS: ":9999"
              VPN_SERVICE_PROVIDER: protonvpn
              SERVER_COUNTRIES: "New Zealand"
              HTTPPROXY: "on"
              HTTPPROXY_LISTENING_ADDRESS: :8888
              HTTPPROXY_LOG: "on"
            envFrom:
              - secretRef:
                  name: gluetun-proxy
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 9999
                  timeoutSeconds: 10
                  periodSeconds: 30
                  failureThreshold: 5
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 9999
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  failureThreshold: 5
            securityContext:
              capabilities:
                add:
                  - NET_ADMIN
    service:
      app:
        controller: gluetun
        type: LoadBalancer
        loadBalancerIP: 192.168.50.105
        annotations:
          lbipam.cilium.io/ips: 192.168.50.105
          "coredns.io/hostname": "gluetun.${SECRET_DOMAIN}"
        ports:
          http:
            port: 8888
