---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: soju
spec:
  chartRef:
    kind: OCIRepository
    name: soju
  interval: 1h
  values:
    controllers:
      main:
        containers:
          main:
            image: 
              repository: codeberg.org/emersion/soju
              tag: v0.10.1
    service:
      main:
        controller: main
        type: LoadBalancer
        ports:
          irc:
            port: 6697
            protocol: TCP
        loadBalancerIP: 192.168.50.104
        annotations:
          coredns.io/hostname: "soju.${SECRET_DOMAIN}"
          lbipam.cilium.io/ips: "192.168.50.104"
    persistence:
      soju-config:
        enabled: true
        type: configMap
        name: soju
        advancedMounts:
          main:
            main:
              - path: /soju-config
                subPath: soju-config
      data:
        enabled: true
        type: persistentVolumeClaim
        storageClass: local-hostpath
        accessMode: ReadWriteOnce
        size: 100Mi
        dataSourceRef:
          kind: ReplicationDestination
          apiGroup: volsync.backube
          name: soju-restore
      tls:
        enabled: true
        type: secret
        name: "${SECRET_DOMAIN/./-}-production"
