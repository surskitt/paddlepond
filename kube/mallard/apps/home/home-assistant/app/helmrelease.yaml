---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
spec:
  chartRef:
    kind: OCIRepository
    name: home-assistant
  interval: 1h
  values:
    defaultPodOptions:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
    controllers:
      home-assistant:
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/home-assistant
              tag:  2026.11.0@sha256:7c1ab60a4bb4cc1f34c314bc209d72d7b7336f0da38d4a69064935d01bba1ba6 
            env:
              TZ: "Europe/London"
            securityContext:
              runAsUser: 568
              runAsGroup: 568
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
              startup:
                enabled: false
            # resources:
            #   requests:
            #     cpu: 48m
            #     memory: 443M
            #   limits:
            #     memory: 709M
    service:
      app:
        ports:
          http:
            port: &port 8123
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |
            group: home
        hostnames:
          - "home-assistant.${SECRET_DOMAIN}"
          - "hass.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: networking
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      config:
        enabled: true
        type: persistentVolumeClaim
        storageClass: local-hostpath
        accessMode: ReadWriteOnce
        size: 1Gi
        retain: true
        dataSourceRef:
          kind: ReplicationDestination
          apiGroup: volsync.backube
          name: home-assistant-restore
      db:
        type: persistentVolumeClaim
        storageClass: local-hostpath
        accessMode: ReadWriteOnce
        size: 5Gi
        advancedMounts:
          home-assistant:
            app:
              - path: /config/db
      passwd:
        type: secret
        name: home-assistant-secrets
        defaultMode: 420
        advancedMounts:
          home-assistant:
            app:
            - path: /etc/passwd
              readOnly: true
              subPath: passwd_file
