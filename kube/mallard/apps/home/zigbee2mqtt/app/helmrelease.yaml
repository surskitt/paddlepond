---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zigbee2mqtt
spec:
  chartRef:
    kind: OCIRepository
    name: zigbee2mqtt
  interval: 1h
  values:
    controllers:
      zigbee2mqtt:
        containers:
          app:
            image:
              repository: ghcr.io/koenkk/zigbee2mqtt
              tag: 2.7.1
            env:
              TZ: "Europe/London"
              ZIGBEE2MQTT_DATA: /data
              ZIGBEE2MQTT_CONFIG_DEVICE_OPTIONS_RETAIN: "true"
              ZIGBEE2MQTT_CONFIG_PERMIT_JOIN: "false"
              ZIGBEE2MQTT_CONFIG_MQTT_SERVER: mqtt://mosquitto:1883
              ZIGBEE2MQTT_CONFIG_SERIAL_PORT: /dev/ttyUSB0
              ZIGBEE2MQTT_CONFIG_ADVANCED_DEFAULT: "24"
              ZIGBEE2MQTT_CONFIG_ADVANCED_CHANNEL: "24"
              ZIGBEE2MQTT_CONFIG_ADVANCED_FRONTENT_PORT: "8080"
              ZIGBEE2MQTT_CONFIG_ADVANCED_EXPERIMENTAL_NEW_API: "true"
            securityContext:
              privileged: true
            resources:
              requests:
                cpu: 10m
                memory: 100Mi
              limits:
                memory: 500Mi
    service:
      app:
        ports:
          http:
            port: &port 8080
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |
            group: home
        hostnames:
          - "zigbee2mqtt.${SECRET_DOMAIN}"
          - "zb.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: networking
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      data:
        enabled: true
        type: persistentVolumeClaim
        storageClass: local-hostpath
        retain: true
        accessMode: ReadWriteOnce
        size: 1Gi
        dataSourceRef:
          kind: ReplicationDestination
          apiGroup: volsync.backube
          name: zigbee2mqtt-restore
      usb:
        enabled: true
        type: hostPath
        hostPath: /dev/ttyUSB0
