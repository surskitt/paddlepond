- op: add
  path: /spec/values/controllers/qbittorrent/containers/app/env/NEMOROSA_ENABLE
  value: false

- op: remove
  path: /spec/values/controllers/qbittorrent/containers/app/resources

- op: remove
  path: /spec/values/persistence/downloads

- op: add
  path: /spec/values/persistence/12tb
  value:
    enabled: true
    type: hostPath
    hostPath: /var/mnt/12tb/media/downloads/torrents
    advancedMounts:
      qbittorrent:
        app:
          - path: /downloads/12tb

