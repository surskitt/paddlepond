---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: media
resources:
  - ../../../../../mallard/apps/media/qui/app
patches:
  - target:
      kind: HelmRelease
      name: qui
      namespace: media
    path: patches/helmrelease.yaml
  - target:
      kind: ReplicationSource
      name: qui
      namespace: media
    path: patches/replicationsource.yaml
  - target:
      kind: ReplicationSource
      name: qui-r2
      namespace: media
    path: patches/replicationsource-r2.yaml
