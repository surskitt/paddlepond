min_version = "2026.7.0"

[env]
KUBECONFIG = "{{config_root}}/mallard-kubeconfig"
SOPS_CONFIG = "{{config_root}}/.sops.yaml"
SOPS_AGE_KEY_FILE = "{{config_root}}/age.key"
TALOSCONFIG = "{{config_root}}/talos/mallard/talosconfig"

[tools]
age = "1.3.2"
cloudflared = "2026.10.7"
flux2 = "2.10.0"
gh = "2.102.0"
gum = "2.0.2"
helm = "4.3.1"
helmfile = "1.8.2"
jq = "1.8.2"
just = "1.59.0"
kubeconform = "0.8.0"
kubectl = "1.37.2"
kustomize = "5.8.3"
lefthook = "2.2.2"
node = "26.13.0"
oxfmt = "0.72.0"
sops = "3.13.3"
talosctl = "1.14.2"
"github:postfinance/topf" = "v0.6.1"
yq = "4.54.1"
zizmor = "1.30.1"

[settings]
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-arm64", "macos-x64"]

[hooks]
postinstall = "lefthook install"
