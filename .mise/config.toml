min_version = "2026.7.0"

[env]
SOPS_CONFIG = "{{config_root}}/.sops.yaml"
SOPS_AGE_KEY_FILE = "{{config_root}}/age.key"

[tools]
age = "1.3.2"
cloudflared = "2026.11.0"
flux2 = "2.10.0"
gh = "2.104.0"
gum = "2.0.2"
helm = "4.3.1"
helmfile = "1.8.4"
jq = "1.8.2"
just = "1.59.0"
kubeconform = "0.8.0"
kubectl = "1.37.2"
kustomize = "5.8.3"
lefthook = "2.2.2"
node = "26.13.1"
oxfmt = "0.75.0"
sops = "3.13.3"
talosctl = "1.14.5"
"github:postfinance/topf" = "v0.6.2"
yq = "4.54.3"
zizmor = "1.32.0"

[settings]
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-arm64", "macos-x64"]

[hooks]
postinstall = "lefthook install"
